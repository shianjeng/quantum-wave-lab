name: Pages
# Publishes web/ to GitHub Pages. One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["web/**", "reference/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test
        working-directory: web
      - name: Collect the site (no tests, no package.json)
        run: |
          mkdir _site
          cp -r web/index.html web/style.css web/favicon.svg web/js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
